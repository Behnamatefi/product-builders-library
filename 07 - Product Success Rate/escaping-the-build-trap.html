  "core": {
    "name": {

      "fa": "نتیجه، نه خروجی"

    "principle": {
      "en": "Escaping the build trap means measuring success by outcomes — the value you create for customers and the business — not by output, the features you ship. Products are only vehicles of value: they win when they solve a real problem and earn something back. A real product manager, a decision-making strategy, a disciplined process, and a culture that rewards learning are how you get out and stay out.",
      "fa": "فرار از تلهٔ ساختن یعنی موفقیت را با نتیجه بسنجی — ارزشی که برای مشتری و کسب‌وکار می‌سازی — نه با خروجی، یعنی ویژگی‌هایی که عرضه می‌کنی. محصول فقط وسیلهٔ ارزش است: وقتی می‌بَرد که یک مشکلِ واقعی را حل کند و چیزی پس بگیرد. یک مدیرِ محصولِ واقعی، یک استراتژیِ تصمیم‌ساز، یک فرایندِ منظم، و فرهنگی که یادگیری را پاداش می‌دهد — این‌هاست که تو را بیرون می‌آورد و بیرون نگه می‌دارد."
    },
    "more": {
      "en": "Perri organizes the escape into five parts — the Build Trap (output vs outcome, the value exchange, feature factories), the Role of the Product Manager (not a mini-CEO but a strategist who owns the why), Strategy (a decision-making framework of vision, strategic intents and initiatives), the Product Management Process (the Product Kata: explore problems, experiment on solutions), and the Product-Led Organization (outcome-based roadmaps, staged budgeting, and a culture that rewards learning). The thread through all of it: manage for outcomes, not output.",
      "fa": "پری این فرار را در پنج بخش می‌چیند — تلهٔ ساختن (خروجی در برابرِ نتیجه، معاملهٔ ارزش، کارخانه‌های ویژگی)، نقشِ مدیرِ محصول (نه یک مدیرعاملِ کوچک، بلکه استراتژیستی که مسئولِ چراییست)، استراتژی (یک چارچوبِ تصمیم‌گیری از چشم‌انداز و نیت‌های استراتژیک و طرح‌ها)، فرایندِ مدیریتِ محصول (کاتای محصول: کاویدنِ مشکل، آزمایشِ راه‌حل)، و سازمانِ محصول‌محور (نقشه‌راهِ نتیجه‌محور، بودجه‌بندیِ مرحله‌ای، و فرهنگی که یادگیری را پاداش می‌دهد). نخِ رابطِ همه‌شان: برای نتیجه کار کن، نه برای خروجی."
