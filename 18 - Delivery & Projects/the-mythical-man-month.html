    "babel": {
      "part": "tarpit",
      "n": 3,
      "name": {
        "en": "Why Did the Tower of Babel Fail?",
        "fa": "چرا برجِ بابل شکست خورد؟"
      },
      "glabel": {
        "en": "Babel",
        "fa": "برجِ بابل"
      },
      "principle": {
        "en": "Babel had a clear goal, materials, time and people. It failed on communication and organisation, and so do software projects.",
        "fa": "برجِ بابل هدف، مصالح، زمان و آدم داشت. سرِ ارتباط و سازمان‌دهی شکست خورد؛ پروژه‌های نرم‌افزاری هم همین‌طور."
      },
      "more": {
        "en": "Training cost grows with the number of people. Communication cost grows much faster: with n people there are n(n−1)/2 pairs who have to stay in step. Brooks's remedies are unglamorous — written documents with owners, a shared project workbook, and an organisation designed to reduce the number of people who must agree.",
        "fa": "هزینهٔ آموزش با تعدادِ آدم‌ها زیاد می‌شود. هزینهٔ ارتباط خیلی سریع‌تر: مسیرهای ارتباطی با توانِ دومِ تعدادِ افراد بالا می‌رود — سه نفر سه مسیر دارند، ده نفر چهل‌وپنج مسیر. درمان‌های بروکس پرزرق‌وبرق نیستند: سندهای نوشته‌شده با مالکِ مشخص، یک دفترچهٔ مشترکِ پروژه، و سازمانی که تعدادِ کسانی را که باید توافق کنند کم می‌کند."
      },
      "example": {
        "en": "A team of ten spends more of the week keeping each other in step than the team of four spent building.",
        "fa": "تیمِ ده‌نفره بیشتر از آن‌که تیمِ چهارنفره وقتِ ساختن گذاشته بود، وقتِ هماهنگ‌ماندن با هم می‌گذارد."
      },
      "tip": {
        "en": "Before adding a person, name exactly who they will need to talk to every day.",

      "pitfall": {
        "en": "Answering a communication problem with another meeting instead of one written document with an owner.",
        "fa": "پاسخ‌دادن به مشکلِ ارتباط با یک جلسهٔ دیگر، به‌جای یک سندِ نوشته‌شده که مالک دارد."
      }
    },
    "aristocracy": {
      "part": "integrity",
      "n": 4,
      "name": {
        "en": "Aristocracy, Democracy, and System Design",
        "fa": "اشرافیت، دموکراسی و طراحیِ سیستم"
      },
      "glabel": {
        "en": "Integrity",
        "fa": "یکپارچگی"
      },
      "principle": {
        "en": "It is better to ship one coherent design missing some good features than many good features with no coherence.",
        "fa": "عرضهٔ یک طراحیِ منسجم که چند ویژگیِ خوب کم دارد، بهتر از ویژگی‌های خوبِ فراوانِ بی‌انسجام است."
      },
      "more": {
        "en": "People learn a system by building a model of it in their heads. A design that came from twenty independent minds hands them twenty models to learn. Brooks separates the architect, who owns what the thing is and speaks for the user, from the implementers, who own how it is built and how fast.",
        "fa": "آدم‌ها یک سیستم را با ساختنِ مدلی از آن در ذهنشان یاد می‌گیرند. طراحی‌ای که از بیست ذهنِ مستقل آمده، بیست مدل برای یادگرفتن جلوی آن‌ها می‌گذارد. بروکس معمار را — که مالکِ «این چیز چیست» است و از طرفِ کاربر حرف می‌زند — از پیاده‌سازان جدا می‌کند، که مالکِ «چطور و با چه سرعتی ساخته می‌شود» هستند."
      },
      "example": {
        "en": "IBM's System/360 held one architecture across a whole family of machines, so the same programs ran on all of them.",
        "fa": "سیستم/۳۶۰ شرکتِ آی‌بی‌ام یک معماریِ واحد را در کلِ خانوادهٔ ماشین‌ها نگه داشت، تا همان برنامه‌ها روی همه‌شان اجرا شوند."
      },
      "tip": {
        "en": "Name one person accountable for what the product is, separate from who builds it.",
        "fa": "یک نفر را مسئولِ «این محصول چیست» کن، جدا از کسانی که می‌سازندش."
      },
      "pitfall": {
        "en": "Designing by committee and calling the result a compromise instead of a mess.",
        "fa": "طراحیِ کمیته‌ای، و بعد اسمِ نتیجه را مصالحه گذاشتن به‌جای آشفتگی."
      }
    },
    "surgical": {
      "part": "integrity",
      "n": 5,
      "name": {
        "en": "The Surgical Team",
        "fa": "تیمِ جراحی"
      },
      "glabel": {
        "en": "Surgical Team",
        "fa": "تیمِ جراحی"
      },
      "principle": {
        "en": "Organise like a surgical team: one mind does the cutting and everyone else exists to support it.",
        "fa": "مثلِ تیمِ جراحی سازمان بگیر: یک ذهن تیغ می‌زند و بقیه هستند تا پشتیبانی‌اش کنند."
      },
      "more": {
        "en": "Brooks takes the proposal from Harlan Mills. A large job is split among small teams, each with a chief programmer who does the design and the code, plus a copilot, a toolsmith, a tester and an administrator who remove everything else. Brooks cites productivity gaps of five to ten times between good and mediocre programmers; the structure is built around that fact.",
        "fa": "بروکس این پیشنهاد را از هارلن میلز می‌گیرد. کارِ بزرگ میانِ تیم‌های کوچک تقسیم می‌شود و هر تیم یک برنامه‌نویسِ ارشد دارد که طراحی و کد را خودش انجام می‌دهد، به‌علاوهٔ یک کمک‌خلبان، یک ابزارساز، یک تست‌کننده و یک مسئولِ اداری که باقیِ کارها را از دوشش برمی‌دارند. بروکس از فاصلهٔ پنج تا ده برابری میانِ برنامه‌نویسِ خوب و متوسط می‌گوید؛ این ساختار دقیقاً روی همان واقعیت بنا شده."
      },
      "example": {
        "en": "Ten people organised this way can hold a single design in their heads; two hundred cannot.",
        "fa": "ده نفر با این ساختار می‌توانند یک طراحیِ واحد را در ذهن نگه دارند؛ دویست نفر نمی‌توانند."
      },
      "tip": {
        "en": "Ask what your strongest builder does that only they can do, then take everything else off their plate.",
        "fa": "بپرس قوی‌ترین سازندهٔ تیم چه کاری می‌کند که فقط از خودش برمی‌آید، بعد باقیِ کارها را از دوشش بردار."
      },
      "pitfall": {
        "en": "Growing a team by cloning generalists instead of adding support around a sharp core.",
        "fa": "بزرگ‌کردنِ تیم با تکثیرِ آدم‌های همه‌فن‌حریف، به‌جای افزودنِ پشتیبانی دورِ یک هستهٔ تیز."
      }
    },
    "second": {
      "part": "integrity",
      "n": 6,
      "name": {
        "en": "The Second-System Effect",
        "fa": "اثرِ سیستمِ دوم"

      "glabel": {
        "en": "Second System",
        "fa": "سیستمِ دوم"
      },
      "principle": {
        "en": "The second system a person designs is the most dangerous one they will ever design.",
        "fa": "سیستمِ دوم، خطرناک‌ترین سیستمی است که آدم در عمرش طراحی می‌کند."
      },
      "more": {
        "en": "The first system is built under doubt, so it stays lean. Success removes the doubt, and every feature that was cut the first time comes back — along with refinements for functions that are already going out of use. Brooks's remedy is self-discipline, and an architect who has been through the cycle at least once.",
        "fa": "سیستمِ اول زیرِ سایهٔ تردید ساخته می‌شود، پس لاغر می‌ماند. موفقیت تردید را برمی‌دارد، و هر ویژگی‌ای که بارِ اول حذف شده بود برمی‌گردد — همراه با ظرافت‌هایی برای کارکردهایی که دارند از رده خارج می‌شوند. درمانِ بروکس خویشتن‌داری است، و معماری که دستِ‌کم یک‌بار این چرخه را از سر گذرانده باشد."
      },
      "example": {
        "en": "OS/360 was Brooks's own second system, following the simple operating systems of IBM's 700 and 7000 machines, and it carried both the features left out before and refinements for techniques already going obsolete.",
        "fa": "سیستم‌عاملِ ۳۶۰ خودش سیستمِ دومِ بروکس بود، پس از سیستم‌عامل‌های سادهٔ ماشین‌های ۷۰۰ و ۷۰۰۰ِ آی‌بی‌ام؛ و هم ویژگی‌های کنارگذاشته‌شده را با خود آورد و هم ظرافت‌هایی برای فنونی که داشتند از رده خارج می‌شدند."
      },
      "tip": {
        "en": "Write down what you deliberately left out of v1 and why, then re-justify each one on its own merit for v2.",
        "fa": "بنویس چه چیزهایی را عمداً از نسخهٔ یک بیرون گذاشتی و چرا، بعد برای نسخهٔ دو هرکدام را دوباره و به‌تنهایی توجیه کن."
      },
      "pitfall": {
        "en": "Treating v2 as the place where every old argument finally gets settled.",
        "fa": "نسخهٔ دو را جایی دانستن که بالاخره همهٔ بحث‌های قدیمی در آن فیصله پیدا می‌کند."
      }
    },

    "space": {

      "more": {
        "en": "OS/360 fought over memory the way a product today fights over load time, bundle size or price. Brooks tells the manager to set the budget, assign it per module, and always pair a size target with a speed target — because a team told only to be small will trade away all the speed to get there.",
        "fa": "سیستم‌عاملِ ۳۶۰ سرِ حافظه می‌جنگید، همان‌طور که محصولِ امروز سرِ زمانِ بارگذاری، حجمِ برنامه یا قیمت می‌جنگد. بروکس به مدیر می‌گوید بودجه را تعیین کن، ماژول به ماژول تقسیمش کن، و همیشه هدفِ اندازه را با هدفِ سرعت جفت کن — چون تیمی که فقط گفته‌ای کوچک باشد، برای رسیدن به آن تمامِ سرعت را معامله می‌کند."

      "example": {
